[project]
name = "sbit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "srgee", email = "sr_gee@yahoo.com" }
]
requires-python = ">=3.12, <3.13"
dependencies = []

[project.scripts]
wearpipe = "sbit.main:main"
setup = "sbit.setup:main"

[build-system]
requires = ["uv_build>=0.12,<0.13", "ruff>=0.16,<0.17"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "databricks-connect>=18.0,<18.4",
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.16.8,<0.17.0",
]

[pytest]
minversion = "9.0"
addopts = "-ra -q --strict-markers -x --durations=10"
import-mode = "importlib"  # Avoid sys.path collisions when test files share names across directories
testpaths = ["tests"]
markers = [
    "unit: marks fast test cases",
    "integration: marks tests requiring spark or external resources",
    "slow: marks slow tests"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (orden de imports)
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade (modernización de sintaxis)
]
ignore = []

[tool.ruff.format]
quote-style = "single"
